<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo — Casa, Matheus &amp; Scarlet</title>
<meta name="description" content="Uma casa, três olhares: caixa, cartões, benefícios e trabalho dos quatro apps em um só lugar.">
<meta name="theme-color" content="#1E5C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexo">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/nexo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/nexo.svg">
<link rel="stylesheet" href="./css/nexo.css?v=0.15.1">
</head>
<body data-privado="0">

<div class="nx-app">

  <header class="nx-top">
    <div class="nx-brand">
      <div class="nx-mark" aria-hidden="true">N</div>
      <div class="nx-brand-txt">
        <div class="nx-brand-nome">Nexo</div>
        <div class="nx-brand-sub" id="periodo">—</div>
      </div>
    </div>
    <div class="nx-top-actions">
      <button class="nx-icon-btn" id="btn-busca" type="button"
              title="Buscar (/) " aria-label="Buscar nos quatro apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
      <button class="nx-icon-btn" id="btn-privacidade" type="button"
              aria-pressed="false" title="Esconder valores" aria-label="Esconder valores">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="nx-icon-btn" id="btn-atualizar" type="button"
              title="Atualizar dados" aria-label="Atualizar dados">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="nx-topo" id="topo">
    <div id="launcher" class="nx-dock" aria-label="Abrir um app"></div>
    <nav class="nx-tabs" id="tabs" role="tablist" aria-label="Áreas do Nexo"></nav>
  </div>

  <div class="nx-instalar" id="instalar" hidden>
    <div class="nx-instalar-txt">
      <strong>Levar o Nexo para a tela inicial</strong>
      <span>Funciona offline e abre em tela cheia.</span>
    </div>
    <button class="nx-btn nx-btn--primario nx-btn--mini" id="btn-instalar" type="button">Baixar o app</button>
  </div>

  <div id="avisos" hidden></div>

  <main id="view" role="tabpanel" aria-live="polite"></main>

  <div id="ajustes" class="nx-ajustes"></div>

  <div class="nx-nuvem">
    <p class="nx-ajustes-rotulo">Nuvem · Apps Script (opcional)</p>
    <div class="nx-nuvem-linha">
      <input id="sync-url" class="nx-input" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="URL do App da Web (/exec)" aria-label="URL do Apps Script">
      <input id="sync-token" class="nx-input" type="password" autocomplete="off"
             placeholder="Token secreto" aria-label="Token do Apps Script">
    </div>
    <button class="nx-btn nx-btn--mini" id="sync-btn" type="button">Sincronizar ajustes</button>
    <p class="nx-ajustes-nota" id="sync-nota">Opcional. Com URL e token, suas regras viajam entre aparelhos.</p>
  </div>

  <footer class="nx-foot">
    <span>Lendo <span id="rodape-fontes">—</span></span>
    <span class="nx-foot-sep">Nexo <span id="versao">—</span> · somente leitura</span>
  </footer>

</div>

<div class="nx-busca" id="busca" hidden>
  <div class="nx-busca-fundo" data-fechar-busca></div>
  <section class="nx-busca-painel" role="dialog" aria-modal="true" aria-labelledby="busca-titulo">
    <h2 class="nx-sr" id="busca-titulo">Buscar nos quatro apps</h2>
    <div class="nx-busca-campo">
      <svg class="nx-busca-icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="busca-input" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="Gasto, tarefa, valor ou mês" aria-label="Buscar nos quatro apps">
      <button class="nx-busca-fechar" id="busca-fechar" type="button" aria-label="Fechar busca">×</button>
    </div>
    <p class="nx-busca-ajuda" id="busca-ajuda">Digite ao menos 2 letras, um valor (921,85) ou um mês.</p>
    <div class="nx-busca-resultados" id="busca-resultados"></div>
  </section>
</div>

<script type="module" src="./js/app.js?v=0.15.1"></script>
</body>
</html>
